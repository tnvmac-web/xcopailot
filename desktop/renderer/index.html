<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Copilot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

/* ── Header ─────────────────────────────────────── */
.header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 18px; color: #e94560; }
.header-actions { display: flex; gap: 8px; }
.btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn-primary { background: #e94560; color: #fff; }
.btn-primary:hover { background: #c73650; }
.btn-secondary { background: #0f3460; color: #e0e0e0; }
.btn-secondary:hover { background: #1a4a80; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* ── Status bar ─────────────────────────────────── */
.status-bar { background: #0f3460; padding: 6px 20px; font-size: 12px; display: flex; gap: 16px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.status-dot.running { background: #00ff88; }
.status-dot.stopped { background: #ff4444; }
.status-dot.error { background: #ffaa00; }

/* ── Chat layout ────────────────────────────────── */
.chat-container { flex: 1; display: flex; overflow: hidden; }

/* Sidebar */
.sidebar { width: 260px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
.sidebar-header { padding: 12px; font-weight: 600; font-size: 13px; color: #aaa; border-bottom: 1px solid #0f3460; }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.sidebar-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 2px; }
.sidebar-item:hover { background: #0f3460; }
.sidebar-item.active { background: #e94560; color: #fff; }

/* Chat area */
.chat-area { flex: 1; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.message.user { background: #0f3460; align-self: flex-end; border-bottom-right-radius: 4px; }
.message.assistant { background: #162447; align-self: flex-start; border-bottom-left-radius: 4px; }
.message.system { background: #1a1a2e; align-self: center; color: #888; font-size: 12px; max-width: 90%; text-align: center; }
.message.error { background: #3d1018; align-self: flex-start; border: 1px solid #e94560; }

/* Streaming cursor */
.cursor { display: inline-block; width: 2px; height: 16px; background: #e94560; animation: blink 1s infinite; vertical-align: text-bottom; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

/* Input area */
.input-area { padding: 16px; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
.input-area textarea { flex: 1; background: #162447; border: 1px solid #0f3460; border-radius: 8px; padding: 12px; color: #e0e0e0; font-size: 14px; font-family: inherit; resize: none; height: 48px; max-height: 120px; outline: none; }
.input-area textarea:focus { border-color: #e94560; }
.input-area .send-btn { background: #e94560; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-size: 14px; height: 48px; }
.input-area .send-btn:hover { background: #c73650; }
.input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Delegation panel ────────────────────────────── */
.delegation-panel { width: 300px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; }
.delegation-panel-header { padding: 12px; font-weight: 600; font-size: 13px; color: #aaa; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
.delegation-list { flex: 1; overflow-y: auto; padding: 8px; }
.delegation-item { padding: 10px; border-radius: 6px; background: #0f3460; margin-bottom: 6px; font-size: 12px; }
.delegation-item .goal { color: #e0e0e0; margin-bottom: 4px; }
.delegation-item .meta { color: #888; font-size: 11px; }
.delegation-item .status { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.status-pending { background: #333; color: #ffaa00; }
.status-running { background: #1a3a6e; color: #4488ff; }
.status-succeeded { background: #1a3e1e; color: #00ff88; }
.status-failed { background: #3e1a1a; color: #ff4444; }
.status-cancelled { background: #222; color: #888; }

/* ── Settings modal ──────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: #16213e; border-radius: 12px; padding: 24px; min-width: 400px; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal h2 { margin-bottom: 16px; color: #e94560; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
.modal-field input, .modal-field select, .modal-field textarea { width: 100%; background: #0f3460; border: 1px solid #0f3460; border-radius: 6px; padding: 8px; color: #e0e0e0; font-size: 13px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 900px) {
  .sidebar { width: 200px; }
  .delegation-panel { width: 240px; }
}
@media (max-width: 700px) {
  .sidebar, .delegation-panel { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🤖 X-Copilot</h1>
  <div class="header-actions">
    <button class="btn btn-sm btn-secondary" id="btn-settings">⚙ Settings</button>
    <button class="btn btn-sm btn-secondary" id="btn-delegate-panel">📋 Tasks</button>
    <button class="btn btn-sm btn-primary" id="btn-new-chat">✕ New Chat</button>
  </div>
</div>

<div class="status-bar">
  <span><span class="status-dot" id="server-dot"></span> Server: <span id="server-status-text">Checking...</span></span>
  <span>v<span id="app-version">0.1.1</span></span>
</div>

<div class="chat-container">
  <div class="sidebar">
    <div class="sidebar-header">Sessions</div>
    <div class="sidebar-list" id="sidebar-sessions"></div>
  </div>

  <div class="chat-area">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
      <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
      <button class="send-btn" id="btn-send" disabled>Send</button>
    </div>
  </div>

  <div class="delegation-panel" id="delegation-panel" style="display:none;">
    <div class="delegation-panel-header">
      <span>Delegated Tasks</span>
      <button class="btn btn-sm btn-secondary" id="btn-close-panel">✕</button>
    </div>
    <div class="delegation-list" id="delegation-list"></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal" style="display:none;">
  <div class="modal">
    <h2>Settings</h2>
    <div class="modal-field">
      <label>Model</label>
      <input id="setting-model" value="gpt-4o-mini">
    </div>
    <div class="modal-field">
      <label>Permission Mode</label>
      <select id="setting-permission">
        <option value="standard">Standard</option>
        <option value="plan">Plan</option>
        <option value="bypass">Bypass</option>
        <option value="auto-ask">Auto Ask</option>
        <option value="dont-ask">Don't Ask</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Provider</label>
      <select id="setting-provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="ollama">Ollama</option>
        <option value="lmstudio">LM Studio</option>
        <option value="openrouter">OpenRouter</option>
        <option value="nvidia">NVIDIA</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btn-settings-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-settings-save">Save</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────
const state = {
  sessionId: null,
  messages: [],
  serverRunning: false,
  streamCallback: null,
};

// ── DOM refs ─────────────────────────────────────────
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const btnSend = document.getElementById('btn-send');
const btnNewChat = document.getElementById('btn-new-chat');
const btnSettings = document.getElementById('btn-settings');
const btnDelegatePanel = document.getElementById('btn-delegate-panel');
const btnClosePanel = document.getElementById('btn-close-panel');
const delegationPanel = document.getElementById('delegation-panel');
const delegationList = document.getElementById('delegation-list');
const sidebarSessions = document.getElementById('sidebar-sessions');
const serverDot = document.getElementById('server-dot');
const serverStatusText = document.getElementById('server-status-text');
const settingsModal = document.getElementById('settings-modal');
const appVersion = document.getElementById('app-version');

// ── Stream callback for renderer ─────────────────────
window._streamCallback = (text) => {
  // Appended by streaming logic below
};

// ── Server status ────────────────────────────────────
async function checkServerStatus() {
  try {
    const status = await window.xcopilot.serverStatus();
    updateServerStatus(status);
  } catch {
    updateServerStatus({ status: 'error' });
  }
}

function updateServerStatus(status) {
  const dot = serverDot;
  dot.className = 'status-dot';
  if (status.status === 'running') {
    dot.classList.add('running');
    serverStatusText.textContent = 'Running';
    state.serverRunning = true;
    btnSend.disabled = false;
  } else if (status.status === 'error') {
    dot.classList.add('error');
    serverStatusText.textContent = 'Error';
    state.serverRunning = false;
    btnSend.disabled = true;
  } else {
    dot.classList.add('stopped');
    serverStatusText.textContent = 'Stopped';
    state.serverRunning = false;
    btnSend.disabled = true;
  }
}

async function startServer() {
  const result = await window.xcopilot.serverStart();
  checkServerStatus();
  return result;
}

// ── Chat ─────────────────────────────────────────────
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = content;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function addStreamingMessage() {
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = '<span class="cursor"></span>';
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function updateStreamingMessage(div, text) {
  div.innerHTML = text + '<span class="cursor"></span>';
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || !state.serverRunning) return;

  chatInput.value = '';
  btnSend.disabled = true;

  // Add user message
  addMessage('user', text);
  state.messages.push({ role: 'user', content: text });

  // Add assistant placeholder
  const assistantDiv = addStreamingMessage();

  try {
    const model = document.getElementById('setting-model').value;
    const response = await fetch('http://127.0.0.1:8001/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer admin' },
      body: JSON.stringify({ messages: state.messages, model, session_id: state.sessionId }),
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();
    const reply = data.response || data.content || 'No response';
    assistantDiv.innerHTML = reply;
    state.messages.push({ role: 'assistant', content: reply });

    // Save session
    state.sessionId = data.session_id || state.sessionId;
  } catch (err) {
    assistantDiv.className = 'message error';
    assistantDiv.innerHTML = `Error: ${err.message}. Is the server running?`;
  }

  btnSend.disabled = false;
  chatInput.focus();
}

async function newChat() {
  state.sessionId = null;
  state.messages = [];
  chatMessages.innerHTML = '';
  addMessage('system', 'New conversation started');
  chatInput.focus();
  await loadSessions();
}

// ── Sessions sidebar ─────────────────────────────────
async function loadSessions() {
  try {
    const resp = await fetch('http://127.0.0.1:8001/api/sessions', {
      headers: { 'Authorization': 'Bearer admin' },
    });
    if (!resp.ok) return;
    const data = await resp.json();
    sidebarSessions.innerHTML = data.sessions.map(s =>
      `<div class="sidebar-item" data-id="${s.id}">${s.title}</div>`
    ).join('');

    sidebarSessions.querySelectorAll('.sidebar-item').forEach(el => {
      el.addEventListener('click', () => loadSession(el.dataset.id));
    });
  } catch {
    sidebarSessions.innerHTML = '<div style="padding:8px;color:#888;font-size:12px;">No sessions</div>';
  }
}

async function loadSession(sessionId) {
  try {
    const resp = await fetch(`http://127.0.0.1:8001/api/sessions/${sessionId}`, {
      headers: { 'Authorization': 'Bearer admin' },
    });
    if (!resp.ok) return;
    const session = await resp.json();
    state.sessionId = session.id;
    const messages = await fetchMessages(sessionId);
    state.messages = messages;
    chatMessages.innerHTML = '';
    messages.forEach(m => addMessage(m.role, m.content));
    // Update sidebar active
    sidebarSessions.querySelectorAll('.sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === sessionId);
    });
  } catch (err) {
    console.error('Failed to load session:', err);
  }
}

async function fetchMessages(sessionId) {
  try {
    const resp = await fetch(`http://127.0.0.1:8001/api/sessions/${sessionId}/messages`, {
      headers: { 'Authorization': 'Bearer admin' },
    });
    if (!resp.ok) return [];
    const data = await resp.json();
    return data.messages || [];
  } catch {
    return [];
  }
}

// ── Delegation panel ─────────────────────────────────
async function loadDelegationTasks() {
  try {
    const resp = await fetch('http://127.0.0.1:8001/api/delegation/tasks', {
      headers: { 'Authorization': 'Bearer admin' },
    });
    if (!resp.ok) return;
    const data = await resp.json();
    delegationList.innerHTML = data.tasks.map(t => `
      <div class="delegation-item">
        <div class="goal">${(t.goal || '').substring(0, 50)}</div>
        <div class="meta">${t.task_id} · ${t.created_at}</div>
        <span class="status status-${t.status}">${t.status}</span>
      </div>
    `).join('');
  } catch {
    delegationList.innerHTML = '<div style="padding:8px;color:#888;font-size:12px;">No tasks</div>';
  }
}

// ── Settings ─────────────────────────────────────────
function openSettings() {
  settingsModal.style.display = 'flex';
}

function closeSettings() {
  settingsModal.style.display = 'none';
}

async function saveSettings() {
  const settings = {
    model: document.getElementById('setting-model').value,
    permission_mode: document.getElementById('setting-permission').value,
    provider: document.getElementById('setting-provider').value,
  };
  try {
    await fetch('http://127.0.0.1:8001/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer admin' },
      body: JSON.stringify(settings),
    });
  } catch {
    // Settings saved locally if server unavailable
  }
  closeSettings();
}

// ── Event listeners ──────────────────────────────────
btnSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

btnNewChat.addEventListener('click', newChat);
btnSettings.addEventListener('click', openSettings);
document.getElementById('btn-settings-cancel').addEventListener('click', closeSettings);
document.getElementById('btn-settings-save').addEventListener('click', saveSettings);

btnDelegatePanel.addEventListener('click', () => {
  const panel = delegationPanel;
  const visible = panel.style.display !== 'none';
  panel.style.display = visible ? 'none' : 'flex';
  if (!visible) loadDelegationTasks();
});
btnClosePanel.addEventListener('click', () => {
  delegationPanel.style.display = 'none';
});

// ── Auto-resize textarea ─────────────────────────────
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// ── Init ─────────────────────────────────────────────
async function init() {
  appVersion.textContent = (await window.xcopilot.version()).version;
  await checkServerStatus();
  await loadSessions();
  chatInput.focus();

  // Periodic server status check
  setInterval(checkServerStatus, 10000);
}

init();
</script>
</body>
</html>
