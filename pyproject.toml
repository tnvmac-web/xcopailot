[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-copilot"
version = "0.1.1"
description = "Self-growing AI agent for Windows with 5-layer memory, auto skill creation, and permission pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.25",
    "pydantic>=2.0",
    "jsonlines>=4.0",
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "requests>=2.31",
    "tiktoken>=0.5",
    "networkx>=3.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio", "pytest-cov", "httpx"]
cli = ["rich"]

[project.scripts]
xcopilot = "xcopilot.cli.main:cli"